  <style>
    /* Instant CSS Splash & Preloader */
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      color: #F8FAFC;
    }
    #preloader {
      text-align: center;
      transition: opacity 0.4s ease;
    }
    .pulse-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366F1 0%, #06B6D4 100%);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .pulse-title {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .pulse-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
    }
    .spinner {
      margin: 20px auto 0;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: #6366F1;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="pulse-logo">
      <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Mortarboard Diamond Crest -->
        <polygon points="50,18 78,32 50,44 22,32" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linejoin="round"/>
        <!-- Golden Academic Spark -->
        <circle cx="50" cy="18" r="4" fill="#FDE047"/>
        <!-- Biometric Pulse Waveform -->
        <path d="M16,60 L34,60 L40,68 L50,26 L60,76 L66,60 L84,60" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Coral Terminus Node -->
        <circle cx="84" cy="60" r="5.5" fill="#F43F5E"/>
        <circle cx="84" cy="60" r="2.5" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="pulse-title">Kampuzz</div>
    <div class="pulse-sub">Campus Life Operating System</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
