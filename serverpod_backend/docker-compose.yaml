version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuspulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password_campuspulse_2026
      POSTGRES_DB: campus_pulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: campuspulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
