# Serverpod Cloud Production Configuration (Serverpod Cloud Starter Tier)
apiServer:
  port: 8080
  publicHost: api.campuspulse.serverpod.cloud
  publicPort: 443
  publicScheme: https

insightsServer:
  port: 8081
  publicHost: insights.campuspulse.serverpod.cloud
  publicPort: 443
  publicScheme: https

webServer:
  port: 8082
  publicHost: campuspulse.serverpod.cloud
  publicPort: 443
  publicScheme: https

database:
  # In Serverpod Cloud, managed PostgreSQL host & credentials are auto-injected via environment
  host: ${SERVERPOD_DATABASE_HOST}
  port: 5432
  name: ${SERVERPOD_DATABASE_NAME}
  user: ${SERVERPOD_DATABASE_USER}
  requireSsl: true

redis:
  enabled: true
  host: ${SERVERPOD_REDIS_HOST}
  port: 6379
