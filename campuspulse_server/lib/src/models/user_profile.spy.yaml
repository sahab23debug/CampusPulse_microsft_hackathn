class: UserProfile
table: user_profile
fields:
  userInfoId: int
  fullName: String
  email: String
  avatarUrl: String?
  collegeId: int
  collegeName: String
  branchId: int
  branchName: String
  sectionId: int
  sectionName: String
  year: int
  semester: int
  bio: String?
  interests: List<String>
  skills: List<String>
  githubUrl: String?
  linkedinUrl: String?
  role: String
  sgpaJson: String?
  notesUploadedCount: int
  averageRatingReceived: double
  quizRank: int
  createdAt: DateTime
indexes:
  user_profile_userinfo_idx:
    fields: userInfoId
    unique: true
  user_profile_college_idx:
    fields: collegeId
  user_profile_branch_idx:
    fields: branchId
